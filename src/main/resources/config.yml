# REQUIRED
# Token to run the bot with
token: "PUT_BOT_TOKEN_HERE"

# REQUIRED (if using components)
# Database to use for components (THIS IS NOT FOR THE BOT'S DATA)
# Supports: MariaDB, SQLite, PostgreSQL, H2
database: "PUT_CONNECTION_STRING_HERE"

# RECOMMENDED (if using Pterodactyl)
# The bot will use the Pterodactyl API to gracefully stop the server when requested
pterodactyl:
  panel-url: "PUT_PTERODACTYL_PANEL_URL_HERE" # Example: panel.lilypad.gg
  api-key: "PUT_PTERODACTYL_API_KEY_HERE"
  server-id: "PUT_PTERODACTYL_SERVER_ID_HERE"

# RECOMMENDED
# Owner IDs of the bot
owners:
  # This one will be DMed when an error occurs
  primary: 000000000000000000
  # These will just be able to use owner commands
  other:
    - 000000000000000000
    - 000000000000000000
    - 000000000000000000
